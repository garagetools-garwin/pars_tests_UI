name: pars_tests_UI

# Определение события, запускающего workflow
on: 
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Choose runner type'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - self-hosted
          - github-hosted
  # push:
  #   branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]
  # schedule:
  #   - cron: '0 5 * * *'    
    # - cron: '0 14 * * *'

# Определение Задачи(job)
jobs:
  # Основная часть тестов
  tests-github-hosted:
    timeout-minutes: 260

    # Уникальный ключ для группы задач предназначен для того, чтобы повторный запуск Джобы вставал в ожидание, не конфликтуая с первым
    concurrency: pars_tests_UI_concurrency

    # запуск на виртуальной машине
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.runner_type == 'github-hosted' || github.event.inputs.runner_type == 'both')
    runs-on: ubuntu-latest
    env:
      ADMIN_BUYER_EMAIL: ${{ secrets.ADMIN_BUYER_EMAIL }}
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      PROXY_HOST: ${{ secrets.PROXY_HOST }}
      PROXY_PORT: ${{ secrets.PROXY_PORT }}
      PROXY_USER: ${{ secrets.PROXY_USER }}
      PROXY_PASS: ${{ secrets.PROXY_PASS }}
      
    steps:

      # Клонирование репозитория
      - uses: actions/checkout@v4

      # Установка Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.1'

      # Установка зависимостей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Install proxychains
      #   run: sudo apt-get update && sudo apt-get install -y proxychains4

      # - name: Setup proxychains.conf (from secrets)
      #   run: |
      #     echo "dynamic_chain" > proxychains.conf
      #     echo "proxy_dns" >> proxychains.conf
      #     echo "[ProxyList]" >> proxychains.conf
      #     echo "socks5 ${{ secrets.DANTE_HOST }} ${{ secrets.DANTE_PORT }} ${{ secrets.DANTE_USER }} ${{ secrets.DANTE_PASS }}" >> proxychains.conf
      #     sudo cp proxychains.conf /etc/proxychains.conf

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      
      # Установка браузеров
      - name: Ensure browsers are installed
        run: python -m playwright install --with-deps

      # Узнаю IP VM
      - name: Print public IP
        run: |
          curl ifconfig.me || curl ipinfo.io/ip || curl icanhazip.com

      # - name: proxy test
      #   run: proxychains curl https://httpbin.org/ip

      # - name: proxy test
      #   run: proxychains chromium --headless --disable-gpu --no-sandbox --dump-dom https://httpbin.org/ip

      # Запуск тестов
      - name: Run tests
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pytest --headed --alluredir=allure-results
          
      # Проверка наличия json-файлов в allure-results (чтобы не запушить сломаный отчет)
      - name: Check if Allure results exist
        if: always()
        id: check_allure
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results/*.json 2>/dev/null)" ]; then
            echo "allure_results_exist=true" >> $GITHUB_OUTPUT
          else
            echo "allure_results_exist=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Debug allure_results_exist
        if: always()
        run: echo "allure_results_exist=${{ steps.check_allure.outputs.allure_results_exist }}"


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extracted-ip
          path: extracted_ip.txt

      # Загрузка артефактов
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        with:
          name: allure-results-main-${{ github.run_id }}
          path: allure-results/
          # retention_days: 10

      # Получение истории прогонов Allure
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Генерация отчета с учетом истории прогонов
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      # Публикация отчета Allure  
      - name: Publish Allure report
        uses: peaceiris/actions-gh-pages@v2
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        env:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history

      - name: Upload prices.csv artifact
        uses: actions/upload-artifact@v4
        with:
          name: prices
          path: prices.csv

# Job для self-hosted runner (по расписанию + вручную)
  tests-self-hosted:
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner_type == 'self-hosted' || github.event.inputs.runner_type == 'both'))
    timeout-minutes: 260
    concurrency: pars_tests_UI_concurrency
    runs-on: self-hosted  # Запуск на вашем сервере
    env:
      ADMIN_BUYER_EMAIL: ${{ secrets.ADMIN_BUYER_EMAIL }}
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      PROXY_HOST: ${{ secrets.PROXY_HOST }}
      PROXY_PORT: ${{ secrets.PROXY_PORT }}
      PROXY_USER: ${{ secrets.PROXY_USER }}
      PROXY_PASS: ${{ secrets.PROXY_PASS }}
    steps:
      - name: Check and free disk space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h
          
          # Cleanup workspace WITH SUDO
              sudo rm -rf ${{ github.workspace }}/* 2>/dev/null || true
              sudo rm -rf ${{ github.workspace }}/.??* 2>/dev/null || true
              sudo chown -R runner:runner ${{ github.workspace }} 2>/dev/null || true
          
          # Cleanup if disk usage > 80%
          USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
          if [ "$USAGE" -gt 80 ]; then
            echo "Disk usage is ${USAGE}%, cleaning up..."
            docker system prune -a -f || true
            sudo journalctl --vacuum-size=50M || true
          fi
          
          echo "=== Disk usage after cleanup ==="
          df -h
      
      - uses: actions/checkout@v4
        with:
          clean: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.1'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      
      - name: Ensure browsers are installed
        run: python -m playwright install chromium
      
      - name: Print public IP
        run: |
          curl ifconfig.me || curl ipinfo.io/ip || curl icanhazip.com
      
      - name: Run tests
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pytest --headed --alluredir=allure-results
      
      - name: Check if Allure results exist
        if: always()
        id: check_allure
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results/*.json 2>/dev/null)" ]; then
            echo "allure_results_exist=true" >> $GITHUB_OUTPUT
          else
            echo "allure_results_exist=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        with:
          name: allure-results-self-hosted-${{ github.run_id }}
          path: allure-results/
      
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
      
      - name: Publish Allure report
        uses: peaceiris/actions-gh-pages@v2
        if: always() && steps.check_allure.outputs.allure_results_exist == 'true'
        env:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history
      
      - name: Upload prices.csv artifact
        uses: actions/upload-artifact@v4
        with:
          name: prices-self-hosted
          path: prices.csv


  # # Автоматический перезапуск при падении
  # rerun-on-failure:
  #   needs: tests
  #   if: failure() && fromJSON(github.run_attempt) < 3  # Максимум 3 попытки
  #   runs-on: ubuntu-latest
  #   permissions:
  #     actions: write
  #   steps:
  #     - name: Trigger rerun
  #       run: |
  #         gh run rerun ${{ github.run_id }} --repo ${{ github.repository }}
  #       env:
  #         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-on-failure:
    if: |
      always() &&
      (needs.tests-self-hosted.result == 'failure' || needs.tests-github-hosted.result == 'failure') ||
      (failure()) ||
      (needs.test.result == 'error') ||
      (contains(needs.*.result, 'error'))
    runs-on: ubuntu-latest
    needs: [tests-self-hosted, tests-github-hosted]
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ GitHub Actions FAILED in ${{ github.repository }}"
          body: |
           ❗ Workflow [${{ github.workflow }}] failed.

            🔗 View it here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            📦 Commit: ${{ github.sha }}
            👤 Triggered by: ${{ github.actor }}
          to: urin.a@garagetools.ru
          from: GitHub Actions <${{ secrets.GMAIL_USERNAME }}>

  notify-on-success:
    if: always() && (needs.tests-self-hosted.result == 'success' || needs.tests-github-hosted.result == 'success')
    runs-on: ubuntu-latest
    needs: [tests-self-hosted, tests-github-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prices
          path: .
      - name: Send success email with prices.csv
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✔️ GitHub Actions PASSED: Prices CSV"
          body: |
            ✅ Тест успешно завершён.
    
            📦 Commit: ${{ github.sha }}
            👤 Triggered by: ${{ github.actor }}
          to: urin.a@garagetools.ru
          from: GitHub Actions <${{ secrets.GMAIL_USERNAME }}>
          attachments: prices.csv

      - name: Commit prices.csv to data branch
        run: |
          git config --global user.email "urin.a@garagetools.ru"
          git config --global user.name "GitHub Actions Bot"
          git checkout -B data
          mkdir -p data
          mv prices.csv data/prices.csv
          git add data/prices.csv
          git commit -m "Update prices.csv" || echo "No changes"
          git push origin data --force

      # - name: Upload prices.csv to Google Drive
      #   uses: willo32/google-drive-upload-action@v1
      #   with:
      #     credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
      #     parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
      #     target: prices.csv
      #     name: prices.csv
