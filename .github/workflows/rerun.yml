name: Rerun Failed Workflow

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID to rerun'
        required: true

jobs:
  rerun:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun workflow
        run: |
          gh run rerun ${{ github.event.inputs.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
